name: Refresh FJC judges
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_fjc.py'
      - '.github/workflows/refresh-fjc.yml'
      - 'scripts/verify_wikipedia.py'
      - 'scripts/audit_recent_portraits.py'
  schedule:
    - cron: '25 9 * * *'
concurrency:
  group: fjc-refresh-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile current FJC records
        run: python scripts/update_fjc.py
      - name: Verify judge Wikipedia article links
        run: python scripts/verify_wikipedia.py
      - name: Audit official photo provenance for recent appointments
        run: python scripts/audit_recent_portraits.py
      - name: Commit reconciled roster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add judgesFJC2.json fjc-audit.json recent-judge-portrait-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh judicial roster from FJC"
            git push
          fi
